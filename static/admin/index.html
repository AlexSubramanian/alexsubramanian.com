<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Homelab · admin</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0f172a; --panel:#1e293b; --panel-2:#172033; --line:#334155; --line-soft:#263347;
  --ink:#e2e8f0; --dim:#94a3b8; --faint:#64748b;
  --accent:#22d3ee;
  --ok:#4ade80; --due:#fbbf24; --unknown:#a78bfa; --bad:#f87171;
  --ok-bg:#132b1e; --due-bg:#2e2510; --unknown-bg:#241e3d; --bad-bg:#2e1718;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 0 96px;
}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* ---------- masthead + verdict ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.93);backdrop-filter:blur(8px);
     border-bottom:1px solid var(--line-soft)}
.top-inner{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.brandline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.brand b{color:var(--dim);font-weight:600}
.verdict{display:flex;align-items:center;gap:11px;min-height:28px}
.verdict-dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--faint)}
.verdict-text{font-size:1.06rem;font-weight:500;letter-spacing:-.01em}
.verdict small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.02em;font-weight:400;margin-top:2px}

/* signature: one pip per container, rack-panel style */
.pips{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.pip{width:13px;height:7px;border-radius:1.5px;background:var(--faint);flex:none}
.pip.ok{background:var(--ok)} .pip.due{background:var(--due)}
.pip.unknown{background:var(--unknown)} .pip.bad{background:var(--bad)}
.pip.pinned{background:var(--accent)}
.pip-sep{width:1px;height:11px;background:var(--line);margin:0 5px;flex:none}

/* ---------- attention ---------- */
.attention{margin:18px 0 0;border:1px solid var(--due);background:var(--due-bg);border-radius:7px;padding:13px 15px}
.attention h2{margin:0 0 7px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--due);font-weight:600}
.attention ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.attention li::marker{color:var(--due)}

/* ---------- host cards ---------- */
.hosts{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.host{border:1px solid var(--line-soft);border-radius:9px;background:var(--panel-2);overflow:hidden}
.host.unreachable{border-color:var(--bad)}
.host-head{display:flex;align-items:center;gap:11px;padding:13px 16px;background:var(--panel);
  border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.host-name{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.01em}
.host-meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto;text-align:right}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:3px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.due{background:var(--due-bg);color:var(--due)}
.chip.unknown{background:var(--unknown-bg);color:var(--unknown)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.pinned{background:#10303a;color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:9px 16px;border-top:1px solid var(--line-soft);vertical-align:middle}
tr:first-child td{border-top:0}
td.svc{font-family:var(--mono);font-weight:500;white-space:nowrap}
td.ver{font-family:var(--mono);color:var(--dim);font-size:12.5px;width:99%}
td.state{text-align:right;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;vertical-align:middle;flex:none}
.dot.ok{background:var(--ok)} .dot.due{background:var(--due)}
.dot.unknown{background:var(--unknown)} .dot.bad{background:var(--bad)} .dot.pinned{background:var(--accent)}
.arrow{color:var(--due)}

.host-foot{display:flex;gap:9px;padding:12px 16px;border-top:1px solid var(--line-soft);
  background:var(--panel);flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
button{font-family:var(--sans);font-size:13px;font-weight:500;border-radius:6px;cursor:pointer;
  padding:7px 13px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  transition:border-color .12s,background .12s}
button:hover:not(:disabled){border-color:var(--faint)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:var(--due);border-color:var(--due);color:#1c1403;font-weight:600}
button.primary:hover:not(:disabled){background:#fcd34d;border-color:#fcd34d}
button.danger{border-color:#6b3a3a;color:#fca5a5}
button.danger:hover:not(:disabled){border-color:var(--bad)}
.cost{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}

/* ---------- plex + links ---------- */
.strip{display:flex;align-items:center;gap:11px;margin-top:20px;padding:12px 16px;
  border:1px solid var(--line-soft);border-radius:9px;background:var(--panel-2);flex-wrap:wrap}
.strip .label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.strip .val{font-family:var(--mono);font-size:13px}
.links{display:flex;gap:9px;margin-left:auto;flex-wrap:wrap}
.links a{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;
  border:1px solid var(--line);border-radius:6px;padding:6px 11px}
.links a:hover{border-color:var(--accent)}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- log drawer ---------- */
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel-2);
  border-top:1px solid var(--line);max-height:62vh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .22s ease}
.drawer.open{transform:translateY(0)}
.drawer-head{display:flex;align-items:center;gap:11px;padding:11px 20px;border-bottom:1px solid var(--line-soft);
  background:var(--panel)}
.drawer-title{font-family:var(--mono);font-size:12.5px;font-weight:600}
.drawer-status{font-family:var(--mono);font-size:11px;color:var(--faint)}
.drawer pre{margin:0;padding:14px 20px;overflow:auto;font-family:var(--mono);font-size:12px;
  line-height:1.65;color:var(--dim);white-space:pre-wrap;word-break:break-word;flex:1}
.spin{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);
  animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

.muted{color:var(--faint);font-family:var(--mono);font-size:12.5px}
.err{border:1px solid var(--bad);background:var(--bad-bg);border-radius:7px;padding:13px 15px;margin-top:18px;font-size:13.5px}

@media (max-width:620px){
  body{font-size:14px}
  .host-meta{margin-left:0;text-align:left;width:100%}
  td{padding:8px 12px}
  td.ver{font-size:11.5px}
  .cost{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brandline">
      <span class="brand">homelab <b>/admin</b></span>
      <span class="pips" id="pips"></span>
    </div>
    <div class="verdict">
      <span class="verdict-dot" id="verdict-dot"></span>
      <span class="verdict-text" id="verdict">Loading…<small id="verdict-sub"></small></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="attention"></div>
  <div class="hosts" id="hosts"></div>
  <div class="strip">
    <span class="label">Plex</span>
    <span class="val" id="plex">checking…</span>
    <span class="links">
      <a href="https://grafana.alexsubramanian.com" rel="noopener">Grafana</a>
      <a href="https://tautulli.alexsubramanian.com" rel="noopener">Tautulli</a>
      <a href="https://app.plex.tv" rel="noopener">Plex</a>
    </span>
  </div>
</main>

<section class="drawer" id="drawer" aria-live="polite">
  <div class="drawer-head">
    <span class="spin" id="drawer-spin"></span>
    <span class="drawer-title" id="drawer-title">job</span>
    <span class="drawer-status" id="drawer-status"></span>
    <button style="margin-left:auto" onclick="closeDrawer()">Close</button>
  </div>
  <pre id="drawer-log"></pre>
</section>

<script>
const API = "/admin/api";
let overview = null, polling = null;

// Cloudflare Access supplies the session cookie; the edge adds the JWT header
// that admin-api verifies. Nothing authenticating lives in this page.
async function api(path, opts) {
  const r = await fetch(API + path, Object.assign({credentials: "same-origin"}, opts || {}));
  if (r.status === 401 || r.status === 403 || r.redirected) {
    throw new Error("SESSION");
  }
  if (!r.ok) {
    let detail = "";
    try { detail = (await r.json()).detail || ""; } catch (e) {}
    throw new Error(detail || ("HTTP " + r.status));
  }
  return r.json();
}

// One state per container. "unknown" is its own state on purpose: a failed
// lookup must never be rendered as a clean result.
function containerState(c, hostReachable) {
  if (!hostReachable) return "unknown";
  if (c.remote_check_failed) return "unknown";
  if (c.pinned) return "pinned";
  if (c.state !== "running") return "bad";
  if (c.update_available) return "due";
  return "ok";
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function render(d) {
  overview = d;
  const pips = document.getElementById("pips");
  pips.innerHTML = "";

  let due = 0, unknown = 0, bad = 0, pinned = 0, total = 0;
  d.hosts.forEach((h, i) => {
    if (i) pips.appendChild(el("span", "pip-sep"));
    const cs = (h.status && h.status.status && h.status.status.containers) || [];
    if (!h.reachable || !cs.length) {
      const p = el("span", "pip unknown");
      p.title = h.host + ": " + (h.error || "no data");
      pips.appendChild(p);
      unknown++; total++;
      return;
    }
    cs.forEach(c => {
      const st = containerState(c, h.reachable);
      const p = el("span", "pip " + st);
      p.title = h.host + " / " + c.compose_service + " — " + st;
      pips.appendChild(p);
      total++;
      if (st === "due") due++;
      else if (st === "unknown") unknown++;
      else if (st === "bad") bad++;
      else if (st === "pinned") pinned++;
    });
  });

  // The verdict never reports "all current" while anything is unknown.
  let tone = "ok", msg, sub = [];
  if (unknown) { tone = "unknown"; msg = unknown + " container" + (unknown === 1 ? "" : "s") + " in an unknown state"; }
  else if (bad) { tone = "bad"; msg = bad + " container" + (bad === 1 ? "" : "s") + " not running"; }
  else if (due) { tone = "due"; msg = due + " update" + (due === 1 ? "" : "s") + " available"; }
  else { msg = "Everything is current"; }
  if (pinned) sub.push(pinned + " pinned by a rollback");
  sub.push(total + " containers across " + d.hosts.length + " hosts");
  sub.push("checked " + new Date(d.fetched_at).toLocaleTimeString());

  document.getElementById("verdict-dot").style.background =
    "var(--" + (tone === "ok" ? "ok" : tone) + ")";
  const v = document.getElementById("verdict");
  v.firstChild.nodeValue = msg;
  document.getElementById("verdict-sub").textContent = sub.join(" · ");

  const att = document.getElementById("attention");
  att.innerHTML = "";
  if (d.attention && d.attention.length) {
    const box = el("div", "attention");
    box.appendChild(el("h2", null, "Needs a look"));
    const ul = el("ul");
    d.attention.forEach(a => ul.appendChild(el("li", null, a)));
    box.appendChild(ul);
    att.appendChild(box);
  }

  const wrap = document.getElementById("hosts");
  wrap.innerHTML = "";
  d.hosts.forEach(h => wrap.appendChild(hostCard(h)));
}

function hostCard(h) {
  const card = el("div", "host" + (h.reachable ? "" : " unreachable"));
  const head = el("div", "host-head");
  head.appendChild(el("span", "host-name", h.host));

  const s = h.summary, st = h.status;
  if (!h.reachable) head.appendChild(el("span", "chip bad", "unreachable"));
  else if (s.remote_failures) head.appendChild(el("span", "chip unknown", s.remote_failures + " unknown"));
  else if (s.updates) head.appendChild(el("span", "chip due", s.updates + " due"));
  else head.appendChild(el("span", "chip ok", "current"));
  if (s.pinned) head.appendChild(el("span", "chip pinned", s.pinned + " pinned"));

  const meta = el("span", "host-meta");
  if (h.reachable && st) {
    const age = st.age_seconds;
    meta.textContent = "agent " + (h.agent ? h.agent.agent_version : "?") +
      " · checked " + (age < 90 ? age + "s" : Math.round(age / 60) + "m") + " ago";
  } else {
    meta.textContent = h.error || "no response";
  }
  head.appendChild(meta);
  card.appendChild(head);

  const containers = (st && st.status && st.status.containers) || [];
  if (!h.reachable) {
    const p = el("div", "muted");
    p.style.padding = "14px 16px";
    p.textContent = "No data. The agent did not answer, so nothing can be said about this host — this is not the same as being up to date.";
    card.appendChild(p);
  } else if (!containers.length) {
    const p = el("div", "muted");
    p.style.padding = "14px 16px";
    p.textContent = (st && st.error) || "The agent returned no containers.";
    card.appendChild(p);
  } else {
    const table = el("table");
    containers.forEach(c => {
      const state = containerState(c, h.reachable);
      const tr = el("tr");
      const svc = el("td", "svc");
      svc.appendChild(el("span", "dot " + state));
      svc.appendChild(document.createTextNode(c.compose_service));
      tr.appendChild(svc);

      const ver = el("td", "ver");
      ver.appendChild(document.createTextNode(c.display_version || "—"));
      if (state === "due") {
        ver.appendChild(el("span", "arrow", "  →  update available"));
      } else if (state === "pinned") {
        ver.appendChild(document.createTextNode("  ·  held by rollback"));
      }
      tr.appendChild(ver);

      const stCell = el("td", "state");
      if (state === "unknown") stCell.appendChild(el("span", "chip unknown", "unknown"));
      else if (state === "bad") stCell.appendChild(el("span", "chip bad", c.state));
      else if (state === "pinned") stCell.appendChild(el("span", "chip pinned", "pinned"));
      else if (c.local_pending) stCell.appendChild(el("span", "chip due", "needs restart"));
      tr.appendChild(stCell);
      table.appendChild(tr);
    });
    card.appendChild(table);
  }

  const foot = el("div", "host-foot");
  // "Check now" didn't say what it did. The page shows each agent's cached
  // inventory (refreshed every 6h); this re-asks the registries, which costs a
  // round trip per image and takes several seconds.
  const check = el("button", null, "Check registries");
  check.title = "Ask each registry whether a newer image exists. Takes a few " +
    "seconds. Otherwise this page shows the agent's cached answer, refreshed every 6 hours.";
  check.onclick = () => runCheck(h.host, check);
  foot.appendChild(check);

  const upd = el("button", "primary", "Update stack");
  upd.disabled = !h.reachable || !s.updates;
  upd.onclick = () => confirmUpdate(h);
  foot.appendChild(upd);

  if (s.pinned) {
    const unpin = el("button", null, "Release " + s.pinned + " pin" + (s.pinned === 1 ? "" : "s"));
    unpin.onclick = () => confirmRollback(h, true);
    foot.appendChild(unpin);
  } else if (h.reachable) {
    const rb = el("button", "danger", "Roll back");
    rb.onclick = () => confirmRollback(h, false);
    foot.appendChild(rb);
  }

  if (h.reachable && containers.length) {
    foot.appendChild(el("span", "cost",
      "restarts " + containers.length + " containers · ~1 min down"));
  }
  card.appendChild(foot);
  return card;
}

async function confirmUpdate(h) {
  const n = ((h.status.status && h.status.status.containers) || []).length;
  const due = (h.status.status.containers || []).filter(c => c.update_available)
    .map(c => c.compose_service).join(", ");
  let warn = "";
  if (h.host === "plex") {
    try {
      const a = await api("/plex/activity");
      if (a.ok && a.stream_count > 0) {
        warn = "\n\n" + a.stream_count + " Plex stream" +
          (a.stream_count === 1 ? " is" : "s are") + " playing right now and will be cut off.";
      }
    } catch (e) {}
  }
  if (h.host === "monitoring") warn += "\n\nThis also restarts Grafana and Prometheus.";
  const ok = confirm(
    "Update " + h.host + "?\n\nUpdating: " + due +
    "\n\nThe whole stack restarts through systemd, so all " + n +
    " containers are recreated — about a minute of downtime." + warn);
  if (ok) startJob(h.host, "/update", {}, "Updating " + h.host);
}

async function confirmRollback(h, clear) {
  if (clear) {
    if (!confirm("Release the rollback pin on " + h.host +
      "?\n\nThe pinned services go back to tracking :latest and the stack restarts.")) return;
    startJob(h.host, "/rollback", {clear: true}, "Releasing pin on " + h.host);
    return;
  }
  let hist;
  try { hist = await api("/hosts/" + h.host + "/history"); }
  catch (e) { return showError(e); }
  const snaps = hist.snapshots || [];
  if (!snaps.length) { alert("No rollback point recorded for " + h.host + " yet.\n\nOne is written automatically before each update."); return; }
  const s = snaps[0];
  const names = s.containers.map(c => c.compose_service + " @ " + (c.display_version || "?")).join("\n  ");
  if (confirm("Roll " + h.host + " back to " + s.timestamp + "?\n\nOnly services that changed since then are pinned:\n  " +
      names + "\n\nThe stack restarts, and pinned services stop receiving updates until you release the pin.")) {
    startJob(h.host, "/rollback", {}, "Rolling back " + h.host);
  }
}

async function runCheck(host, btn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "Asking registries…";
  try { await api("/hosts/" + host + "/check", {method: "POST"}); await load(); }
  catch (e) { showError(e); }
  finally { btn.disabled = false; btn.textContent = old; }
}

async function startJob(host, path, body, title) {
  let res;
  try {
    res = await api("/hosts/" + host + path, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
  } catch (e) { return showError(e); }
  if (!res.job_id) { return showError(new Error(res.error || "no job started")); }
  openDrawer(title);
  pollJob(host, res.job_id);
}

function openDrawer(title) {
  document.getElementById("drawer-title").textContent = title;
  document.getElementById("drawer-log").textContent = "";
  document.getElementById("drawer-status").textContent = "running";
  document.getElementById("drawer-spin").style.display = "inline-block";
  document.getElementById("drawer").classList.add("open");
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  if (polling) { clearTimeout(polling); polling = null; }
}

function pollJob(host, jobId) {
  let offset = 0;
  const log = document.getElementById("drawer-log");
  const tick = async () => {
    let j;
    try { j = await api("/hosts/" + host + "/jobs/" + jobId + "?offset=" + offset); }
    catch (e) { document.getElementById("drawer-status").textContent = "lost contact: " + e.message; return; }
    if (j.log) { log.textContent += j.log; log.scrollTop = log.scrollHeight; }
    offset = j.next_offset;
    if (j.state === "running") { polling = setTimeout(tick, 1500); return; }
    document.getElementById("drawer-spin").style.display = "none";
    document.getElementById("drawer-status").textContent =
      j.state === "succeeded" ? "finished" :
      j.state === "busy" ? "another job was already running — nothing changed" :
      "failed (exit " + j.exit_code + ")";
    load();
  };
  tick();
}

function showError(e) {
  if (e.message === "SESSION") {
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="wrap"><div class="err">Your session expired. <a href="/admin/" style="color:var(--accent)">Reload to sign in again.</a></div></div>');
    return;
  }
  const box = el("div", "err", "Something went wrong: " + e.message);
  document.getElementById("attention").prepend(box);
  setTimeout(() => box.remove(), 9000);
}

async function loadPlex() {
  const n = document.getElementById("plex");
  try {
    const a = await api("/plex/activity");
    if (!a.ok) { n.textContent = "unavailable"; return; }
    if (!a.stream_count) { n.textContent = "nothing playing"; return; }
    n.textContent = a.stream_count + " stream" + (a.stream_count === 1 ? "" : "s") + ": " +
      a.sessions.map(s => s.user + " — " + s.title).join(" · ");
  } catch (e) { n.textContent = "unavailable"; }
}

async function load() {
  try { render(await api("/overview")); }
  catch (e) { showError(e); }
}

load();
loadPlex();
setInterval(load, 60000);
</script>
</body>
</html>
